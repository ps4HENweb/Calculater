<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CASIO Scientific Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calculator-wrap">
      <div class="calculator casio">
        <div class="top-brand">
          <span class="brand">CASIO</span>
          <div class="brand-mini">fx-991ES PLUS</div>
          <div class="brand-sub">NATURAL-V.P.A.M.</div>
        </div>

        <div class="display-panel">
          <div class="display-header">
            <span class="status-btn">DEG</span>
            <span class="status-btn">FIX</span>
            <span class="status-btn">M</span>
          </div>
          <div id="history" class="history"> </div>
          <div id="expression" class="expression">0</div>
          <div id="result" class="result">0</div>
        </div>

        <div id="fractionBox" class="fraction-panel hidden">
          <div class="fraction-title">القسمة بالبسط والمقام</div>
          <div class="fraction-row">
            <input id="numerator" type="number" placeholder="البسط" />
            <span class="divide-bar"></span>
            <input id="denominator" type="number" placeholder="المقام" />
          </div>
          <button id="applyFraction" class="fraction-apply">إدراج الكسر</button>
        </div>

        <div class="row mode-row">
          <button class="mode active" data-mode="basic">BASIC</button>
          <button class="mode" data-mode="scientific">SCI</button>
          <button class="mode" data-mode="fraction">a/b</button>
        </div>

        <div id="scientificPad" class="scientific pad hidden">
          <button data-value="sin(" class="func">sin</button>
          <button data-value="cos(" class="func">cos</button>
          <button data-value="tan(" class="func">tan</button>
          <button data-value="log(" class="func">log</button>
          <button data-value="ln(" class="func">ln</button>

          <button data-value="asin(" class="func">sin⁻¹</button>
          <button data-value="acos(" class="func">cos⁻¹</button>
          <button data-value="atan(" class="func">tan⁻¹</button>
          <button data-value="sqrt(" class="func">√</button>
          <button data-value="^2" class="func">x²</button>

          <button data-value="π" class="func constant">π</button>
          <button data-value="e" class="func constant">e</button>
          <button data-value="^" class="func">xʸ</button>
          <button data-value="!" class="func">n!</button>
          <button data-value="%" class="func">%</button>
        </div>

        <div class="button-grid">
          <button class="key soft" data-action="clear">AC</button>
          <button class="key soft" data-action="backspace">DEL</button>
          <button class="key soft" data-value="(">(</button>
          <button class="key soft" data-value=")">)</button>
          <button class="key operator" data-value="÷">÷</button>

          <button class="key" data-value="7">7</button>
          <button class="key" data-value="8">8</button>
          <button class="key" data-value="9">9</button>
          <button class="key operator" data-value="×">×</button>
          <button class="key operator" data-value="−">−</button>

          <button class="key" data-value="4">4</button>
          <button class="key" data-value="5">5</button>
          <button class="key" data-value="6">6</button>
          <button class="key operator" data-value="+">+</button>
          <button class="key operator" data-value="%">%</button>

          <button class="key" data-value="1">1</button>
          <button class="key" data-value="2">2</button>
          <button class="key" data-value="3">3</button>
          <button class="key operator" data-value="^">xʸ</button>
          <button class="key equals" data-action="equals">=</button>

          <button class="key wide" data-value="0">0</button>
          <button class="key" data-value=".">.</button>
          <button class="key" data-action="ans">Ans</button>
          <button class="key" data-action="fraction">a/b</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
