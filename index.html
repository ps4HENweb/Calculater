<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة Casio التفاعلية</title>
    <style>
        /* إعدادات الخطوط والخلفية */
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            direction: ltr; /* اتجاه الأرقام من اليسار لليمين */
        }

        /* هيكل الحاسبة الخارجي (Casio Style) */
        .calculator {
            background: linear-gradient(135deg, #e0e4e5, #b8bec1);
            padding: 20px 20px 30px 20px;
            border-radius: 25px 25px 40px 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.8);
            width: 320px;
            border: 2px solid #a1a8aa;
        }

        /* العلامة التجارية والتبديل */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .brand {
            font-weight: bold;
            font-style: italic;
            color: #2c3e50;
            font-size: 18px;
            letter-spacing: 1px;
        }

        .mode-switch {
            background: #2c3e50;
            color: #fff;
            border: none;
            padding: 5px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            font-weight: bold;
        }

        /* شاشة الحاسبة */
        .screen-container {
            background: #9dbb96; /* لون شاشة الكاسيو */
            border-radius: 8px;
            padding: 10px;
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.4);
            border: 2px solid #7f8c8d;
            margin-bottom: 20px;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .math-input {
            font-family: 'Share Tech Mono', monospace;
            font-size: 20px;
            color: #111;
            min-height: 40px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            line-height: 1.2;
        }

        .result-output {
            font-family: 'Share Tech Mono', monospace;
            font-size: 24px;
            color: #111;
            text-align: right;
            min-height: 28px;
            font-weight: bold;
        }

        /* تنسيق الكسر المرئي */
        .frac {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            margin: 0 4px;
            font-size: 0.85em;
        }

        .frac .top {
            border-bottom: 1.5px solid #111;
            padding: 0 3px;
            min-width: 12px;
            min-height: 20px;
            text-align: center;
        }

        .frac .bottom {
            padding: 0 3px;
            min-width: 12px;
            min-height: 20px;
            text-align: center;
        }

        /* مؤشر الكتابة (Cursor) */
        .active-box {
            background-color: rgba(0, 0, 0, 0.15);
            border-radius: 2px;
            animation: blink 1.5s infinite;
        }
        @keyframes blink { 50% { opacity: 0.7; } }

        /* منطقة الأزرار */
        .controls-area { display: flex; flex-direction: column; gap: 12px; }
        .row { display: flex; justify-content: space-between; gap: 8px; }

        /* أزرار التنقل (D-Pad) */
        .d-pad-container {
            display: flex;
            justify-content: center;
            margin-bottom: 5px;
        }
        .d-pad {
            background: #4a535c;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            position: relative;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3), inset 0 2px 5px rgba(255,255,255,0.2);
        }
        .d-btn {
            position: absolute;
            background: transparent;
            border: none;
            color: #bdc3c7;
            font-size: 16px;
            cursor: pointer;
            width: 30px; height: 30px;
            display: flex; justify-content: center; align-items: center;
        }
        .d-btn:active { color: #fff; }
        .d-up { top: 0; left: 25px; }
        .d-down { bottom: 0; left: 25px; }
        .d-left { top: 25px; left: 0; }
        .d-right { top: 25px; right: 0; }
        .d-center {
            position: absolute; top: 25px; left: 25px;
            width: 30px; height: 30px;
            background: #34495e; border-radius: 50%;
        }

        /* أزرار الآلة */
        .btn {
            flex: 1;
            padding: 8px 0;
            border-radius: 6px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 0 rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 0 0; }

        /* ألوان الأزرار (Casio Theme) */
        .btn-num { background-color: #f1f2f6; color: #2f3542; }
        .btn-op { background-color: #f1f2f6; color: #2f3542; }
        .btn-sci { background-color: #2d3436; color: #dfe6e9; font-size: 14px; }
        .btn-del { background-color: #e15f41; color: #fff; }
        .btn-eq { background-color: #f1f2f6; color: #2f3542; }

        /* إخفاء الأزرار العلمية في الوضع العادي */
        .scientific-row { display: flex; }
        .standard-mode .scientific-row { display: none; }
    </style>
</head>
<body>

    <div class="calculator" id="calcBody">
        <div class="header">
            <span class="brand">CASIO </span>
            <button class="mode-switch" onclick="toggleMode()" id="modeBtn">وضع علمي</button>
        </div>

        <div class="screen-container">
            <!-- مساحة إدخال المعادلة -->
            <div class="math-input active-box" id="inputContainer"></div>
            <!-- مساحة إخراج الناتج -->
            <div class="result-output" id="resultOutput"></div>
        </div>

        <div class="controls-area">
            
            <!-- أزرار الاتجاهات (D-Pad) -->
            <div class="d-pad-container">
                <div class="d-pad">
                    <button class="d-btn d-up" onclick="navigate('up')">▲</button>
                    <button class="d-btn d-down" onclick="navigate('down')">▼</button>
                    <button class="d-btn d-left" onclick="navigate('left')">◀</button>
                    <button class="d-btn d-right" onclick="navigate('right')">▶</button>
                    <div class="d-center"></div>
                </div>
            </div>

            <!-- الصف العلمي الأول (خاصية الكسر دائماً ظاهرة) -->
            <div class="row">
                <button class="btn btn-sci" onclick="insertFraction()" style="background:#57606f;">a/b</button>
                <button class="btn btn-sci scientific-row" onclick="insertText('√(')">√</button>
                <button class="btn btn-sci scientific-row" onclick="insertText('^')">x²</button>
                <button class="btn btn-sci scientific-row" onclick="insertText('log(')">log</button>
                <button class="btn btn-sci scientific-row" onclick="insertText('ln(')">ln</button>
            </div>

            <!-- الصف العلمي الثاني -->
            <div class="row scientific-row">
                <button class="btn btn-sci" onclick="insertText('(')">(</button>
                <button class="btn btn-sci" onclick="insertText(')')">)</button>
                <button class="btn btn-sci" onclick="insertText('sin(')">sin</button>
                <button class="btn btn-sci" onclick="insertText('cos(')">cos</button>
                <button class="btn btn-sci" onclick="insertText('tan(')">tan</button>
            </div>

            <!-- صف الأرقام الأول -->
            <div class="row">
                <button class="btn btn-num" onclick="insertText('7')">7</button>
                <button class="btn btn-num" onclick="insertText('8')">8</button>
                <button class="btn btn-num" onclick="insertText('9')">9</button>
                <button class="btn btn-del" onclick="deleteLast()">DEL</button>
                <button class="btn btn-del" onclick="clearAll()">AC</button>
            </div>

            <!-- صف الأرقام الثاني -->
            <div class="row">
                <button class="btn btn-num" onclick="insertText('4')">4</button>
                <button class="btn btn-num" onclick="insertText('5')">5</button>
                <button class="btn btn-num" onclick="insertText('6')">6</button>
                <button class="btn btn-op" onclick="insertText('×')">×</button>
                <button class="btn btn-op" onclick="insertText('÷')">÷</button>
            </div>

            <!-- صف الأرقام الثالث -->
            <div class="row">
                <button class="btn btn-num" onclick="insertText('1')">1</button>
                <button class="btn btn-num" onclick="insertText('2')">2</button>
                <button class="btn btn-num" onclick="insertText('3')">3</button>
                <button class="btn btn-op" onclick="insertText('+')">+</button>
                <button class="btn btn-op" onclick="insertText('-')">-</button>
            </div>

            <!-- صف الأرقام الأخير -->
            <div class="row">
                <button class="btn btn-num" onclick="insertText('0')">0</button>
                <button class="btn btn-num" onclick="insertText('.')">.</button>
                <button class="btn btn-sci scientific-row" onclick="insertText('π')">π</button>
                <button class="btn btn-sci scientific-row" onclick="insertText('Ans')">Ans</button>
                <button class="btn btn-eq" onclick="calculate()">=</button>
            </div>
        </div>
    </div>

    <script>
        let mainContainer = document.getElementById('inputContainer');
        let activeContainer = mainContainer; // يحدد أين يكتب المستخدم حالياً (السطر الرئيسي أم البسط أم المقام)
        let isScientific = true;
        let lastAns = "0";

        // تبديل الأوضاع (علمي / عادي)
        function toggleMode() {
            const calc = document.getElementById('calcBody');
            const btn = document.getElementById('modeBtn');
            isScientific = !isScientific;
            if (isScientific) {
                calc.classList.remove('standard-mode');
                btn.textContent = 'وضع علمي';
            } else {
                calc.classList.add('standard-mode');
                btn.textContent = 'وضع عادي';
            }
        }

        // تفعيل المؤشر البصري
        function setActive(element) {
            document.querySelectorAll('.active-box').forEach(el => el.classList.remove('active-box'));
            activeContainer = element;
            activeContainer.classList.add('active-box');
        }

        // كتابة نص عادي أو أرقام
        function insertText(val) {
            let span = document.createElement('span');
            span.textContent = val;
            activeContainer.appendChild(span);
        }

        // إدراج هيكل كسر (بسط ومقام)
        function insertFraction() {
            let fracNode = document.createElement('span');
            fracNode.className = 'frac';
            
            let topNode = document.createElement('span');
            topNode.className = 'top';
            
            let bottomNode = document.createElement('span');
            bottomNode.className = 'bottom';
            
            fracNode.appendChild(topNode);
            fracNode.appendChild(bottomNode);
            
            activeContainer.appendChild(fracNode);
            
            // نقل المؤشر تلقائياً إلى البسط عند إنشاء الكسر
            setActive(topNode);
        }

        // نظام الملاحة بالأسهم (مثل الكاسيو)
        function navigate(direction) {
            if (direction === 'right' || direction === 'down') {
                if (activeContainer.classList.contains('top')) {
                    // من البسط للمقام
                    setActive(activeContainer.nextElementSibling);
                } else if (activeContainer.classList.contains('bottom')) {
                    // الخروج من المقام للسطر الرئيسي
                    setActive(activeContainer.parentElement.parentElement);
                }
            } else if (direction === 'left' || direction === 'up') {
                if (activeContainer.classList.contains('bottom')) {
                    // من المقام للبسط
                    setActive(activeContainer.previousElementSibling);
                } else if (activeContainer.classList.contains('top')) {
                    // الخروج من الكسر للسطر الرئيسي
                    setActive(activeContainer.parentElement.parentElement);
                }
            }
        }

        // مسح آخر مدخل (DEL)
        function deleteLast() {
            if (activeContainer.lastChild) {
                activeContainer.removeChild(activeContainer.lastChild);
            } else {
                // إذا كان المربع فارغاً، نحاول الخروج للسطر الرئيسي
                if (activeContainer !== mainContainer) {
                    let parentFrac = activeContainer.parentElement;
                    setActive(parentFrac.parentElement);
                    parentFrac.remove(); // مسح الكسر الفارغ بالكامل
                }
            }
        }

        // مسح الشاشة (AC)
        function clearAll() {
            mainContainer.innerHTML = '';
            document.getElementById('resultOutput').textContent = '';
            setActive(mainContainer);
        }

        // دالة تفكيك الشجرة البصرية وتحويلها لمعادلة برمجية
        function parseDOM(node) {
            let expression = '';
            for (let child of node.childNodes) {
                if (child.nodeType === Node.TEXT_NODE) {
                    expression += child.nodeValue;
                } else if (child.classList && child.classList.contains('frac')) {
                    let topExpr = parseDOM(child.querySelector('.top'));
                    let botExpr = parseDOM(child.querySelector('.bottom'));
                    
                    // منع القسمة على فراغ
                    if(topExpr === '') topExpr = '0';
                    if(botExpr === '') botExpr = '1';
                    
                    expression += `((${topExpr})/(${botExpr}))`;
                } else if (child.tagName === 'SPAN') {
                    expression += child.textContent;
                }
            }
            return expression;
        }

        // حساب الناتج
        function calculate() {
            // تحويل الشكل المرئي إلى سلسلة نصية
            let mathString = parseDOM(mainContainer);
            
            // معالجة الرموز الرياضية للغات البرمجة
            mathString = mathString.replace(/×/g, '*')
                                   .replace(/÷/g, '/')
                                   .replace(/π/g, 'Math.PI')
                                   .replace(/Ans/g, lastAns);
            
            // معالجة الدوال العلمية (مع تحويل الدرجات لراديان)
            mathString = mathString.replace(/sin\(/g, 'Math.sin((Math.PI/180)*')
                                   .replace(/cos\(/g, 'Math.cos((Math.PI/180)*')
                                   .replace(/tan\(/g, 'Math.tan((Math.PI/180)*')
                                   .replace(/log\(/g, 'Math.log10(')
                                   .replace(/ln\(/g, 'Math.log(')
                                   .replace(/√\(/g, 'Math.sqrt(')
                                   .replace(/\^/g, '**');

            try {
                // تقييم المعادلة
                let result = new Function('return ' + mathString)();
                
                // تنسيق الأرقام العشرية الطويلة
                if (!Number.isInteger(result)) {
                    result = parseFloat(result.toFixed(8));
                }
                
                document.getElementById('resultOutput').textContent = result;
                lastAns = result; // حفظ الإجابة لزر Ans
                
                // إرجاع المؤشر للسطر الرئيسي
                setActive(mainContainer);
            } catch (error) {
                document.getElementById('resultOutput').textContent = "Syntax Error";
                setActive(mainContainer);
            }
        }
    </script>
</body>
</html>
