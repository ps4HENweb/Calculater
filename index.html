<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة احترافية</title>
    <style>
        /* التنسيق العام مستوحى من الواجهات العصرية (iOS Style) */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            direction: ltr; /* للحفاظ على اتجاه الأرقام والمعادلات */
        }

        .calculator {
            background-color: #1c1c1e;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            width: 340px;
            padding: 20px;
            transition: width 0.3s ease;
            overflow: hidden;
        }

        .calculator.scientific-mode {
            width: 600px;
        }

        /* شريط التبديل بين الحاسبة العادية والعلمية */
        .mode-toggle {
            display: flex;
            background-color: #2c2c2e;
            border-radius: 15px;
            margin-bottom: 20px;
            padding: 4px;
        }

        .mode-toggle button {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #8e8e93;
            font-size: 14px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }

        .mode-toggle button.active {
            background-color: #3a3a3c;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        /* شاشة العرض */
        .display {
            text-align: right;
            padding: 20px 10px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            word-wrap: break-word;
        }

        .history {
            color: #8e8e93;
            font-size: 20px;
            min-height: 24px;
            margin-bottom: 5px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px;
        }

        .current {
            color: #ffffff;
            font-size: 48px;
            font-weight: 300;
            letter-spacing: -1px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        /* تنسيق الكسر (بسط ومقام) */
        .frac {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            margin: 0 4px;
            font-size: 0.8em;
        }
        
        .frac .top {
            border-bottom: 2px solid #ffffff;
            padding: 0 4px;
        }
        
        .frac .bottom {
            padding: 0 4px;
        }

        .history .frac .top { border-bottom: 1.5px solid #8e8e93; }

        /* أزرار الحاسبة */
        .keypad-wrapper {
            display: flex;
            gap: 15px;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            flex: 1;
        }

        .scientific-keys {
            display: none;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            flex: 1;
            border-right: 1px solid #3a3a3c;
            padding-right: 15px;
        }

        .calculator.scientific-mode .scientific-keys {
            display: grid;
        }

        .btn {
            background-color: #333336;
            color: #ffffff;
            border: none;
            border-radius: 50%;
            width: 100%;
            aspect-ratio: 1;
            font-size: 24px;
            font-weight: 400;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: inherit;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn.operator {
            background-color: #ff9f0a;
            color: #ffffff;
            font-size: 28px;
        }

        .btn.operator:hover { background-color: #ffb340; }

        .btn.action {
            background-color: #a5a5a5;
            color: #000000;
            font-weight: 500;
        }

        .btn.action:hover { background-color: #d4d4d4; }

        .btn:hover:not(.operator):not(.action) { background-color: #4a4a4c; }

        .btn.zero {
            grid-column: span 2;
            border-radius: 35px;
            aspect-ratio: auto;
            justify-content: flex-start;
            padding-left: 25px;
        }

        /* تنسيق زر الكسر */
        .btn-frac {
            font-size: 20px;
            display: flex;
            flex-direction: column;
            line-height: 1;
        }
        .btn-frac hr {
            width: 60%;
            margin: 2px 0;
            border: none;
            border-top: 2px solid white;
        }

        @media (max-width: 650px) {
            .calculator.scientific-mode {
                width: 90vw;
                border-radius: 20px;
            }
            .keypad-wrapper { flex-direction: column; }
            .scientific-keys { border-right: none; border-bottom: 1px solid #3a3a3c; padding-right: 0; padding-bottom: 15px; }
            .btn { font-size: 20px; }
        }
    </style>
</head>
<body>

    <div class="calculator" id="calculator">
        <!-- أزرار التبديل -->
        <div class="mode-toggle">
            <button id="btnStandard" class="active" onclick="setMode('standard')">عادية</button>
            <button id="btnScientific" onclick="setMode('scientific')">علمية</button>
        </div>

        <!-- الشاشة -->
        <div class="display">
            <div class="history" id="history"></div>
            <div class="current" id="current">0</div>
        </div>

        <div class="keypad-wrapper">
            <!-- الأزرار العلمية -->
            <div class="scientific-keys" id="sciKeys">
                <button class="btn action" onclick="appendSci('sin(')">sin</button>
                <button class="btn action" onclick="appendSci('cos(')">cos</button>
                <button class="btn action" onclick="appendSci('tan(')">tan</button>
                <button class="btn action" onclick="appendSci('log(')">log</button>
                
                <button class="btn action" onclick="appendSci('asin(')">sin⁻¹</button>
                <button class="btn action" onclick="appendSci('acos(')">cos⁻¹</button>
                <button class="btn action" onclick="appendSci('atan(')">tan⁻¹</button>
                <button class="btn action" onclick="appendSci('ln(')">ln</button>
                
                <button class="btn action" onclick="appendSci('Math.sqrt(')">√</button>
                <button class="btn action" onclick="appendOperator('^')">x^y</button>
                <button class="btn action" onclick="appendSci('Math.PI')">π</button>
                <button class="btn action" onclick="appendSci('Math.E')">e</button>
                
                <button class="btn action" onclick="appendSci('(')">(</button>
                <button class="btn action" onclick="appendSci(')')">)</button>
                <button class="btn action" onclick="appendSci('!')">n!</button>
                <button class="btn action" onclick="appendSci('10^')">10^x</button>
            </div>

            <!-- الأزرار العادية الأساسية -->
            <div class="keypad">
                <button class="btn action" onclick="clearAll()">AC</button>
                <button class="btn action" onclick="deleteLast()">⌫</button>
                <!-- زر إدراج الكسر (a/b) -->
                <button class="btn action btn-frac" onclick="appendFraction()">
                    <span>a</span><hr><span>b</span>
                </button>
                <button class="btn operator" onclick="appendOperator('/')">÷</button>

                <button class="btn" onclick="appendNumber('7')">7</button>
                <button class="btn" onclick="appendNumber('8')">8</button>
                <button class="btn" onclick="appendNumber('9')">9</button>
                <button class="btn operator" onclick="appendOperator('*')">×</button>

                <button class="btn" onclick="appendNumber('4')">4</button>
                <button class="btn" onclick="appendNumber('5')">5</button>
                <button class="btn" onclick="appendNumber('6')">6</button>
                <button class="btn operator" onclick="appendOperator('-')">−</button>

                <button class="btn" onclick="appendNumber('1')">1</button>
                <button class="btn" onclick="appendNumber('2')">2</button>
                <button class="btn" onclick="appendNumber('3')">3</button>
                <button class="btn operator" onclick="appendOperator('+')">+</button>

                <button class="btn zero" onclick="appendNumber('0')">0</button>
                <button class="btn" onclick="appendNumber('.')">.</button>
                <button class="btn operator" onclick="calculate()">=</button>
            </div>
        </div>
    </div>

    <script>
        let currentInput = '0';
        let expression = '';
        let expectingDenominator = false; // تتبع حالة إدخال المقام للكسر
        let isEvaluated = false;

        const currentDisplay = document.getElementById('current');
        const historyDisplay = document.getElementById('history');

        // تبديل الأوضاع
        function setMode(mode) {
            const calc = document.getElementById('calculator');
            const btnStd = document.getElementById('btnStandard');
            const btnSci = document.getElementById('btnScientific');

            if (mode === 'scientific') {
                calc.classList.add('scientific-mode');
                btnSci.classList.add('active');
                btnStd.classList.remove('active');
            } else {
                calc.classList.remove('scientific-mode');
                btnStd.classList.add('active');
                btnSci.classList.remove('active');
            }
        }

        // تحديث الشاشة وتحويل علامة التقسيم إلى شكل كسر مرئي
        function updateDisplay() {
            // معالجة العرض لتشكيل الكسر (البسط والمقام)
            let displayHTML = currentInput;
            
            // إذا كنا في حالة إدخال كسر (المستخدم ضغط a/b)
            if (displayHTML.includes('frac_start')) {
                const parts = displayHTML.split('frac_start');
                const num = parts[0] === '' ? '0' : parts[0];
                const den = parts[1] === '' ? '...' : parts[1];
                
                displayHTML = `
                    <div class="frac">
                        <span class="top">${num}</span>
                        <span class="bottom">${den}</span>
                    </div>
                `;
            }

            currentDisplay.innerHTML = displayHTML;
            historyDisplay.innerHTML = formatHistory(expression);
        }

        // دالة مساعدة لتنسيق التاريخ (التحويل لرموز رياضية أنيقة)
        function formatHistory(expr) {
            let formatted = expr.replace(/\*/g, ' × ').replace(/\//g, ' ÷ ').replace(/\+/g, ' + ').replace(/-/g, ' − ');
            formatted = formatted.replace(/Math\.sqrt\(/g, '√(').replace(/Math\.PI/g, 'π').replace(/Math\.E/g, 'e');
            return formatted;
        }

        // إدخال الأرقام
        function appendNumber(num) {
            if (isEvaluated) {
                currentInput = num;
                expression = '';
                isEvaluated = false;
            } else {
                if (currentInput === '0' && num !== '.') {
                    currentInput = num;
                } else {
                    currentInput += num;
                }
            }
            updateDisplay();
        }

        // إدخال العمليات الأساسية
        function appendOperator(op) {
            isEvaluated = false;
            
            // إذا كان هناك كسر قيد التكوين، نحوله إلى عملية قسمة اعتيادية في المعادلة الأساسية
            if (currentInput.includes('frac_start')) {
                let parts = currentInput.split('frac_start');
                let num = parts[0] || '0';
                let den = parts[1] || '1';
                expression += `(${num}/${den}) ${op} `;
            } else {
                expression += `${currentInput} ${op} `;
            }
            
            currentInput = '0';
            expectingDenominator = false;
            updateDisplay();
        }

        // زر إدخال الكسر a/b
        function appendFraction() {
            if (isEvaluated) {
                expression = '';
                isEvaluated = false;
            }
            // إذا لم يكن هناك كسر بالفعل، نضيف علامة البدء لتنسيق الكسر المرئي
            if (!currentInput.includes('frac_start')) {
                currentInput += 'frac_start';
                expectingDenominator = true;
                updateDisplay();
            }
        }

        // إدخال الدوال العلمية
        function appendSci(func) {
            if (isEvaluated) {
                currentInput = func;
                expression = '';
                isEvaluated = false;
            } else {
                if (currentInput === '0') currentInput = func;
                else currentInput += func;
            }
            updateDisplay();
        }

        // مسح الكل (AC)
        function clearAll() {
            currentInput = '0';
            expression = '';
            expectingDenominator = false;
            isEvaluated = false;
            updateDisplay();
        }

        // مسح آخر خانة (Backspace)
        function deleteLast() {
            if (currentInput.length > 1) {
                if(currentInput.endsWith('frac_start')) {
                    expectingDenominator = false;
                    currentInput = currentInput.replace('frac_start', '');
                } else {
                    currentInput = currentInput.slice(0, -1);
                }
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }

        // دالة حساب المضروب (Factorial)
        function factorial(n) {
            if (n === 0 || n === 1) return 1;
            for (let i = n - 1; i >= 1; i--) n *= i;
            return n;
        }

        // حساب النتيجة
        function calculate() {
            let finalExpression = expression;

            // تحويل هيكل الكسر إلى معادلة قابلة للحساب
            if (currentInput.includes('frac_start')) {
                let parts = currentInput.split('frac_start');
                let num = parts[0] || '0';
                let den = parts[1] || '1';
                finalExpression += `(${num}/${den})`;
            } else {
                finalExpression += currentInput;
            }

            // معالجة الدوال الخاصة قبل الـ eval
            // تحويل sin(30) إلى راديان لأن دوال الجافاسكريبت تعمل بالراديان، لكن للحاسبات نفضل الدرجات
            let evalString = finalExpression
                .replace(/sin\(/g, 'Math.sin((Math.PI/180)*')
                .replace(/cos\(/g, 'Math.cos((Math.PI/180)*')
                .replace(/tan\(/g, 'Math.tan((Math.PI/180)*')
                .replace(/asin\(/g, '(180/Math.PI)*Math.asin(')
                .replace(/acos\(/g, '(180/Math.PI)*Math.acos(')
                .replace(/atan\(/g, '(180/Math.PI)*Math.atan(')
                .replace(/log\(/g, 'Math.log10(')
                .replace(/ln\(/g, 'Math.log(')
                .replace(/\^/g, '**')
                .replace(/([0-9]+)!/g, 'factorial($1)');

            try {
                // استخدام Function بدلاً من eval لأمان أكثر قليلاً وتنفيذ رياضي
                let result = new Function('factorial', 'return ' + evalString)(factorial);
                
                // تنسيق الناتج لتجنب الأرقام الطويلة جداً
                if (result % 1 !== 0) {
                    result = parseFloat(result.toFixed(8));
                }

                historyDisplay.innerHTML = formatHistory(finalExpression) + ' =';
                currentInput = result.toString();
                expression = '';
                isEvaluated = true;
                expectingDenominator = false;
                
                // عرض النتيجة
                currentDisplay.innerHTML = currentInput;
            } catch (error) {
                currentDisplay.innerHTML = '<span style="color:#ff453a; font-size:30px;">Error / خطأ رياضي</span>';
                setTimeout(clearAll, 2000);
            }
        }
    </script>
</body>
</html>
